server:
  port: 9002
spring:
  application:
    name: ai-business-service
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

ai:
  engine:
    base-url: ${AI_ENGINE_BASE_URL:http://127.0.0.1:9004}
    analyse-path: /api/v1/ai-engine/resume/analyse
    callback-url: ${AI_ENGINE_CALLBACK_URL:http://127.0.0.1:9002/api/v1/resume/internal/analyse-callback}
    callback-token: ${AI_ENGINE_CALLBACK_TOKEN:dev-callback-token}
    connect-timeout-ms: 3000
    read-timeout-ms: 10000